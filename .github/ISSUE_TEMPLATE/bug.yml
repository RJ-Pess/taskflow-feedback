name: Report a bug
description: Something doesn't work as you expected.
labels: [bug]
body:
  - type: textarea
    id: passos
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Image version (e.g. 1.2.0)
  - type: input
    id: ambiente
    attributes:
      label: System and browser (e.g. macOS, Safari)
