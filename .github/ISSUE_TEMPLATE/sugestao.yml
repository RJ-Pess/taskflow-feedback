name: Sugestão de melhoria
description: Tens uma ideia para a TaskFlow?
labels: [sugestão]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a ideia?
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Que problema resolve ou o que melhora?
  - type: input
    id: versao
    attributes:
      label: Versão da imagem (ex.: 1.0.0)
