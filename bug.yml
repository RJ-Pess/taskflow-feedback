name: Reportar um bug
description: Algo não funciona como esperavas.
labels: [bug]
body:
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que esperavas e o que aconteceu
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão da imagem (ex.: 1.0.0)
  - type: input
    id: ambiente
    attributes:
      label: Sistema e navegador (ex.: macOS, Safari)
